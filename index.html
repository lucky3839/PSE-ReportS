<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ameresco | PSE Reports</title>
<link rel="icon" type="image/png" href="favicon.png">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body data-theme="dark">
<div class="wrap-outer">
  <header class="site-header fade-in">
    <div class="topbar">
      <div class="topbar-brand">
        <div class="brand-mark">
          <img width="30" height="30" style="display:block;object-fit:contain;" src="logo.png" alt="">
        </div>
        <span class="brand-name">Ameresco</span>
        <span class="brand-divider">|</span>
        <span class="brand-product">PSE Reports</span>
      </div>
      <div class="topbar-actions">
        <span class="tagline">
          <svg viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="5" fill="#FFC94D"/><g stroke="#FFC94D" stroke-width="2" stroke-linecap="round"><line x1="12" y1="1" x2="12" y2="4"/><line x1="12" y1="20" x2="12" y2="23"/><line x1="1" y1="12" x2="4" y2="12"/><line x1="20" y1="12" x2="23" y2="12"/><line x1="4.2" y1="4.2" x2="6.3" y2="6.3"/><line x1="17.7" y1="17.7" x2="19.8" y2="19.8"/><line x1="19.8" y1="4.2" x2="17.7" y2="6.3"/><line x1="6.3" y1="17.7" x2="4.2" y2="19.8"/></g></svg>
          Providing a Sustainable Future
        </span>
        <button type="button" id="themeToggle" class="theme-toggle" aria-label="Toggle dark mode" aria-pressed="false">
          <span class="toggle-knob" id="toggleKnob"><svg viewBox="0 0 24 24" width="14" height="14" fill="none"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z" fill="#FFFFFF"/></svg></span>
          <span class="toggle-label" id="toggleLabel">DARK</span>
        </button>
      </div>
    </div>
    <div class="hero" id="heroBanner">
      <div class="hero-content">
        <div class="hero-title-row">
          <svg class="hero-icon" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="5" fill="#FFC94D"/><g stroke="#FFC94D" stroke-width="2" stroke-linecap="round"><line x1="12" y1="1" x2="12" y2="4"/><line x1="12" y1="20" x2="12" y2="23"/><line x1="1" y1="12" x2="4" y2="12"/><line x1="20" y1="12" x2="23" y2="12"/><line x1="4.2" y1="4.2" x2="6.3" y2="6.3"/><line x1="17.7" y1="17.7" x2="19.8" y2="19.8"/><line x1="19.8" y1="4.2" x2="17.7" y2="6.3"/><line x1="6.3" y1="17.7" x2="4.2" y2="19.8"/></g></svg>
          <h1>Solar Performance Report Generator</h1>
        </div>
        <p>Turn your monitoring data into clear, client-ready reports.</p>
      </div>
    </div>
  </header>
<div class="wrap">
  <div class="panel">
    <svg class="card-sun" viewBox="0 0 24 24" fill="none" aria-hidden="true"><circle cx="12" cy="12" r="5" fill="#FFC94D"/><g stroke="#FFC94D" stroke-width="2" stroke-linecap="round"><line x1="12" y1="1" x2="12" y2="4"/><line x1="12" y1="20" x2="12" y2="23"/><line x1="1" y1="12" x2="4" y2="12"/><line x1="20" y1="12" x2="23" y2="12"/><line x1="4.2" y1="4.2" x2="6.3" y2="6.3"/><line x1="17.7" y1="17.7" x2="19.8" y2="19.8"/><line x1="4.2" y1="19.8" x2="6.3" y2="17.7"/><line x1="17.7" y1="6.3" x2="19.8" y2="4.2"/></g></svg>
    <h2>Let's make your report day easy !!</h2>
    <p class="lead">Select which type of report you want to generate</p>
    <div class="btns">
      <button id="new"><span class="ttl"><svg class="btn-ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 16V4M7 9l5-5 5 5M4 20h16"/></svg>New Report</span><span class="sub">Generate a fresh report using raw CSV</span></button>
      <button id="prev"><span class="ttl"><svg class="btn-ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-3-6.7M21 4v5h-5"/></svg>Previous Report</span><span class="sub">Update the previous report using latest month CSV</span></button>
    </div>
    <div class="note" id="note"></div>
  </div>
</div>
</div>


<script src="script.js"></script>
</body>
</html>
